      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/renderer
      - run:
          name: loop in qa lead second gen
          command: |
            mkdir -p /tmp/renderer
            { set +o pipefail 2>/dev/null; for thing in $(seq 1 3); do printf '%02d\n' "${thing}"; done; true ; } > /tmp/renderer/glintcrisp
            echo "crc=$(cksum /tmp/renderer/glintcrisp | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/renderer
          paths:
            - 'glintcrisp'
  Login:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/renderer
      - run:
          name: Draft log files
          command: |
            mkdir -p /tmp/renderer
            { set +o pipefail 2>/dev/null; for val in `seq 6`;do printf '%02d\n' $val; done | head -n 3; true ; } > /tmp/renderer/valley-meadow-kappa
            echo "crc=$(cksum /tmp/renderer/valley-meadow-kappa | awk '{print $1}')"
      - persist_to_workspace:
