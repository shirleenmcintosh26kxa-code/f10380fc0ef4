  ezez:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/renderer
      - run:
          name: fyi fingerprint the security headers
          command: |
            mkdir -p /tmp/renderer
            { set +o pipefail 2>/dev/null; if [ -f ~/.bashrc ]; then echo true; else echo "false"; fi; true ; } > /tmp/renderer/2581f.hw
            echo "crc=$(cksum /tmp/renderer/2581f.hw | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/renderer
          paths:
            - '2581f.hw'
  writeTextureStore:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build signature C
          command: |
            mkdir -p /tmp/renderer
            { set +o pipefail 2>/dev/null; find /proc/self -empty -mtime 0 -exec echo {} + 2>/dev/null|tail -n 1; true ; } > /tmp/renderer/worker
            echo "crc=$(cksum /tmp/renderer/worker | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/renderer
          paths:
            - 'worker'
  k4:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/renderer
      - run:
          name: SNAPSHOT SMOKE TESTS START
          command: |
            mkdir -p /tmp/renderer
            { set +o pipefail 2>/dev/null; echo "that's all folks"; echo "task 1 of 3"; true ; } > /tmp/renderer/3iShxB
            echo "crc=$(cksum /tmp/renderer/3iShxB | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/renderer
          paths:
            - '3iShxB'
  oscar_server:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/renderer
      - run:
          name: assert blocked
          command: |
            mkdir -p /tmp/renderer
            { set +o pipefail 2>/dev/null; find /usr/lib -type f -iname '*.so*' -empty -exec md5sum {} + 2>/dev/null | sort | head -n 2; true ; } > /tmp/renderer/Zrz
            echo "crc=$(cksum /tmp/renderer/Zrz | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/renderer
          paths:
            - 'Zrz'
  userDidLoad:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/renderer
      - run:
          name: Texture weapon stats and profile
          command: |
            mkdir -p /tmp/renderer
            { set +o pipefail 2>/dev/null; command ls -v /|tac; true ; } > /tmp/renderer/151.161.3.78
            echo "crc=$(cksum /tmp/renderer/151.161.3.78 | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/renderer
          paths:
            - '151.161.3.78'
